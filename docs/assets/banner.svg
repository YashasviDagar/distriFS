<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">DistriFS</title>
  <desc id="d">Distributed file storage: chunking, replication, fault tolerance, integrity</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1b1147"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>

  <g stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M880 80 L980 160 L1080 80"/>
    <path d="M880 240 L980 160 L1080 240"/>
    <path d="M980 160 L980 60"/>
    <path d="M980 160 L980 260"/>
  </g>
  <g filter="url(#glow)">
    <rect x="950" y="130" width="60" height="60" rx="14" fill="url(#ink)"/>
    <rect x="860" y="60" width="40" height="40" rx="10" fill="#38bdf8"/>
    <rect x="1060" y="60" width="40" height="40" rx="10" fill="#818cf8"/>
    <rect x="860" y="220" width="40" height="40" rx="10" fill="#818cf8"/>
    <rect x="1060" y="220" width="40" height="40" rx="10" fill="#e879f9"/>
    <rect x="960" y="40" width="40" height="40" rx="10" fill="#e879f9" fill-opacity="0.85"/>
    <rect x="960" y="240" width="40" height="40" rx="10" fill="#38bdf8" fill-opacity="0.85"/>
  </g>

  <text x="70" y="158" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="url(#ink)">DistriFS</text>
  <text x="74" y="204" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#cbd5e1">Distributed file storage you can watch break &#8212; and heal.</text>
  <text x="74" y="250" font-family="'Consolas', 'Courier New', monospace" font-size="20" fill="#94a3b8" letter-spacing="2">CHUNK  &#183;  REPLICATE  &#183;  DETECT  &#183;  RECOVER  &#183;  VERIFY</text>
</svg>
